services:
  mongodb:
    image: mongo:latest
    container_name: mongo
    restart: unless-stopped
    volumes:
      - ./mongo-data:/data/db
    networks:
      - todo-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb
    networks:
      - todo-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "/api"
    container_name: frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - todo-net

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    networks:
      - todo-net

networks:
  todo-net:
    driver: bridge


