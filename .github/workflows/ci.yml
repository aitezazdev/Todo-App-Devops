name: build-and-lint
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code/repo
        uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci
      - name: Lint backend code
        working-directory: ./backend
        run: npm run lint -- --max-warnings=0
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Lint frontend code
        working-directory: ./frontend
        run: npm run lint -- --max-warnings=0
      - name: Build backend image
        run: docker build -t backend ./backend
      - name: Build frontend image
        run: docker build -t frontend ./frontend
  deploy:
    needs: build-and-lint
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (optional)
        uses: actions/checkout@v4
      - name: Add EC2 host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts
      - name: Write SSH key
        run: |
          echo "${{ secrets.EC2_KEY }}" > ec2_key.pem
          chmod 600 ec2_key.pem
      - name: Test SSH Connection
        run: |
          ssh -i ec2_key.pem -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "echo 'SSH connection successful'"

      - name: Deploy on EC2 (git pull + docker compose up -d --build)
        run: |
          ssh -i ec2_key.pem -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            set -e
            cd ${{ secrets.EC2_APP_DIR }}
            git fetch --all
            git reset --hard origin/main
            docker compose up -d --build
            docker image prune -f
            docker compose ps
          "
